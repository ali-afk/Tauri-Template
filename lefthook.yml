source_dir: scripts
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{svelte,ts,json,css,html}"
      run: bun check:biome {staged_files}
      stage_fixed: true
    - name: md
      glob: "*.md"
      run: bun check:md {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: test
      run: bun run test
    - name: rust-test
      run: cargo test --manifest-path src-tauri/Cargo.toml

commit-msg:
  jobs:
    - script: lint-title.ts
      runner: bun
