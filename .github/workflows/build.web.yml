name: Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - uses: extractions/setup-just@v4

      - name: E2E Tests
        run: just test-all --e2e

      - run: just web build
      - uses: actions/upload-artifact@v6
        with:
          name: web-bundle
          path: packages/web/.out/release/
